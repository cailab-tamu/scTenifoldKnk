# Continuous delivery: on a version tag, build and check the source
# tarball, then attach it to a GitHub release.
on:
  push:
    tags: ['v*', '[0-9]*']
  workflow_dispatch:

name: release

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, github::cailab-tamu/scTenifoldNet
          needs: check

      # Tags may be written as 1.2.3, v1.2.3 or v.1.2.3.
      - name: Verify tag matches DESCRIPTION version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pkg_version=$(grep '^Version:' DESCRIPTION | sed 's/Version:[[:space:]]*//')
          tag_version=${GITHUB_REF_NAME#v}
          tag_version=${tag_version#.}
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match DESCRIPTION version $pkg_version"
            exit 1
          fi

      - name: Build source tarball
        run: R CMD build --no-manual .

      - name: Check source tarball
        shell: Rscript {0}
        run: |
          tarball <- Sys.glob("*.tar.gz")
          stopifnot(length(tarball) == 1)
          rcmdcheck::rcmdcheck(tarball, args = c("--no-manual", "--as-cran"),
                               error_on = "warning", check_dir = "check")

      - uses: actions/upload-artifact@v4
        with:
          name: source-tarball
          path: '*.tar.gz'
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-tarball

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" *.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes
